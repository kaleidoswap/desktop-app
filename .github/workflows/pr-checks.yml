name: PR Checks

on:
  pull_request:
    branches:
      - main
      - dev
      - develop

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # Pinned: pnpm 11 stopped reading package.json `pnpm.overrides`, which
          # breaks --frozen-lockfile against the committed lockfile. Stay on 10.
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Formatting
        run: pnpm run check:format
      - name: Lint
        run: pnpm run lint
      - name: Type Check
        run: pnpm run type-check
      - name: Test
        run: pnpm run test:run
      - name: Build Frontend
        run: pnpm run build

  backend-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-1 librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      # The maker signer embeds `signer-core` from the private p2pd repository (a git dependency in
      # src-tauri/Cargo.toml, fetched with the git CLI per src-tauri/.cargo/config.toml).
      - name: Let cargo fetch the private p2pd repository
        shell: bash
        env:
          P2PD_REPO_TOKEN: ${{ secrets.P2PD_REPO_TOKEN }}
        run: |
          : "${P2PD_REPO_TOKEN:?the P2PD_REPO_TOKEN secret is not set}"
          echo "::add-mask::$P2PD_REPO_TOKEN"
          git config --global url."https://x-access-token:${P2PD_REPO_TOKEN}@github.com/kaleidoswap/p2pd".insteadOf "https://github.com/kaleidoswap/p2pd"

      - name: Check Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
