name: 'P2P daemon image'

# Builds the P2P market daemon as a Docker image and publishes it. Systems where the daemon is not
# bundled (Windows) run this image. The source is fetched from P2PD_REPO (a repository secret) with
# a read-only token (P2PD_REPO_TOKEN, the same one the app build uses).
#
# Run it by hand with the commit or tag of the daemon to build. It prints the image reference with
# its digest: put that line in p2pd.image so the app runs exactly this image.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Daemon commit or tag to build (the one in p2pd.ref)'
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Fetch the daemon source
        shell: bash
        env:
          P2PD_REPO_TOKEN: ${{ secrets.P2PD_REPO_TOKEN }}
          P2PD_REPO: ${{ secrets.P2PD_REPO }}
          REF: ${{ inputs.ref }}
        run: |
          : "${P2PD_REPO_TOKEN:?the P2PD_REPO_TOKEN secret is not set}"
          : "${P2PD_REPO:?the P2PD_REPO secret is not set}"
          echo "::add-mask::$P2PD_REPO_TOKEN"
          git clone --quiet "https://x-access-token:${P2PD_REPO_TOKEN}@${P2PD_REPO}" daemon-src
          git -C daemon-src checkout --quiet "$REF"
          echo "SHORT=$(git -C daemon-src rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: daemon-src
          file: daemon-src/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/p2pd:${{ env.SHORT }}

      - name: The reference to pin
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "### P2P daemon image"
            echo
            echo "Put this line in \`p2pd.image\`:"
            echo
            echo '```'
            echo "${HUB_USER}/p2pd:${SHORT}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
