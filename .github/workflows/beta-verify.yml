name: Desktop beta

on:
  push:
    branches: [dev, codex/desktop-beta-integration, codex/p2p-beta-verification]
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check beta version and installer identity
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path("src-tauri/tauri.beta.conf.json").read_text())
          version = config["version"]
          parts = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)-beta\.(\d+)", version)
          if not parts or config["bundle"]["windows"]["wix"]["version"] != ".".join(parts.groups()):
              raise SystemExit("Set matching beta and numeric MSI versions in tauri.beta.conf.json")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != "v" + version:
              raise SystemExit("The tag must match the package beta version")
          PYTHON
      - name: Open or resume the draft for this commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,body |
              jq -e --arg sha "$GITHUB_SHA" '.isDraft and .isPrerelease and (.body | contains($sha))'
          else
            version="${GITHUB_REF_NAME#v}"
            notes="$RUNNER_TEMP/beta-notes.md"
            awk -v heading="## [Version ${version%-beta.*}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
            test -s "$notes"
            printf '\nWindows installers are unsigned. [Windows verification](https://github.com/%s/blob/%s/docs/WINDOWS-BETA-VERIFICATION.md)\n\nBuild commit `%s`.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SHA" >> "$notes"
            gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "KaleidoSwap Desktop $version" --notes-file "$notes"
          fi

  desktop:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 210 || 120 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import Developer ID certificate into an ephemeral keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPLE_CERTIFICATE:?missing Apple certificate}"
          : "${APPLE_SIGNING_IDENTITY:?missing signing identity}"
          : "${KEYCHAIN_PASSWORD:?missing keychain password}"
          : "${APPLE_ID:?missing notarization Apple ID}"
          : "${APPLE_PASSWORD:?missing notarization credential}"
          : "${APPLE_TEAM_ID:?missing Apple team}"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/beta-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/beta-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/beta-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/beta-signing.keychain-db"
          security import "$RUNNER_TEMP/beta-certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$RUNNER_TEMP/beta-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/beta-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/beta-signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          python3 scripts/check-beta-signing.py
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json > "$RUNNER_TEMP/beta-notary-auth.json"
          echo 'Notarization credentials accepted.'
      - name: Prepare Associated Domains signing for the macOS beta
        if: runner.os == 'macOS' && (github.ref_type == 'tag' || github.ref == 'refs/heads/dev')
        id: passkeys
        env:
          APPLE_BETA_PASSKEY_PROFILE: ${{ secrets.APPLE_BETA_PASSKEY_PROFILE }}
        run: |
          if [[ -z "$APPLE_BETA_PASSKEY_PROFILE" ]]; then
            echo 'Building the phrase-only beta because no Desktop passkey profile is configured.'
            exit 0
          fi
          umask 077
          profile="$RUNNER_TEMP/desktop-beta.provisionprofile"
          printf '%s' "$APPLE_BETA_PASSKEY_PROFILE" | base64 --decode > "$profile"
          python3 scripts/prepare-desktop-passkey-signing.py "$profile" com.kaleidoswap.beta
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Verify private daemon access configuration
        if: runner.os != 'Windows'
        env:
          P2PD_REPO: ${{ secrets.P2PD_REPO }}
          P2PD_REPO_TOKEN: ${{ secrets.P2PD_REPO_TOKEN }}
        run: |
          test -n "$P2PD_REPO" || { echo 'Missing P2PD_REPO'; exit 1; }
          test -n "$P2PD_REPO_TOKEN" || { echo 'Missing P2PD_REPO_TOKEN'; exit 1; }
      - name: Check Desktop passkey identity on macOS
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library src-tauri/macos/WalletPasskey.swift \
            src-tauri/macos/tests/WalletPasskeyChecks.swift -o "$RUNNER_TEMP/passkey-checks"
          "$RUNNER_TEMP/passkey-checks"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Pin the MSVC linker instead of Git Bash link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (!(Test-Path $linker)) { throw 'MSVC linker was not installed' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch the locked private signer dependency
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.P2PD_REPO_TOKEN }}@github.com/kaleidoswap/p2pd.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/kaleidoswap/p2pd
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Install frontend and check P2P backend
        env:
          BUILD_AND_RUN_RGB_LIGHTNING_NODE: "false"
        run: |
          pnpm install --frozen-lockfile
          cargo test --locked --manifest-path src-tauri/Cargo.toml p2p
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test build_config
      - name: Verify Windows Credential Manager
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test windows_keyring
      - name: Build bundled Lightning node
        if: runner.os != 'Windows'
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: make release
      - name: Stage Windows placeholder for unsupported native Lightning node
        if: runner.os == 'Windows'
        run: |
          mkdir -p bin
          printf '%s\n' 'Native RGB Lightning Node is unavailable on Windows.' > bin/rgb-lightning-node
      - name: Checkout and stage the exact private daemon revision
        if: runner.os != 'Windows'
        env:
          P2PD_REPO: ${{ secrets.P2PD_REPO }}
          P2PD_REPO_TOKEN: ${{ secrets.P2PD_REPO_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          bash scripts/checkout-p2pd.sh
          P2PD_SRC="$PWD/.p2pd-src" bash scripts/prepare-p2p-bundle.sh
      - name: Build and notarize without a GitHub release or updater upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" != Windows ]]; then extra+=(--config src-tauri/tauri.p2p.conf.json); fi
          if [[ "${{ steps.passkeys.outputs.enabled }}" == true ]]; then extra+=(--config src-tauri/tauri.passkeys.conf.json); fi
          pnpm exec tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config src-tauri/tauri.beta.conf.json "${extra[@]}"
      - name: Verify notarization and Gatekeeper
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/KaleidoSwap Beta.app"
          codesign --verify --deep --strict "$app"
          if [[ "${{ steps.passkeys.outputs.enabled }}" == true ]]; then
            cmp "$RUNNER_TEMP/desktop-beta.provisionprofile" "$app/Contents/embedded.provisionprofile"
            codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/desktop-beta-entitlements.plist"
            python3 - "$RUNNER_TEMP/desktop-beta-entitlements.plist" <<'PY'
          import plistlib, sys
          from pathlib import Path
          expected = plistlib.loads(Path("src-tauri/target/passkey-signing/Entitlements.plist").read_bytes())
          actual = plistlib.loads(Path(sys.argv[1]).read_bytes())
          for key in ("com.apple.application-identifier", "com.apple.developer.team-identifier", "com.apple.developer.associated-domains"):
              if actual.get(key) != expected[key]:
                  raise SystemExit(f"Missing or unexpected signed entitlement {key}")
          PY
          fi
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Verify optimized glib iterator backport on Linux
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target '${{ matrix.target }}' --test glib_variant_iter
      - name: Extract and launch the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - name: Keep verified dev installers for testing
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dev-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Attach verified installers to the draft
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,body |
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .isPrerelease and (.body | contains($sha))'
          root="src-tauri/target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            macOS) files=("$root"/dmg/*.dmg);;
            Linux) files=("$root"/deb/*.deb "$root"/appimage/*.AppImage);;
            Windows) files=("$root"/msi/*.msi "$root"/nsis/*.exe);;
          esac
          for file in "${files[@]}"; do test -f "$file"; done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - name: Clean ephemeral signing and private checkout files
        if: always()
        run: |
          rm -rf .p2pd-src
          if [[ "$RUNNER_OS" == macOS ]]; then
            security delete-keychain "$RUNNER_TEMP/beta-signing.keychain-db" || true
            rm -f "$RUNNER_TEMP/beta-certificate.p12" "$RUNNER_TEMP/beta-notary-auth.json"
            rm -f "$RUNNER_TEMP/desktop-beta.provisionprofile" src-tauri/target/passkey-signing/{embedded.provisionprofile,Entitlements.plist}
          fi

  docker-linux-amd64:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned private daemon
        env:
          P2PD_REPO: ${{ secrets.P2PD_REPO }}
          P2PD_REPO_TOKEN: ${{ secrets.P2PD_REPO_TOKEN }}
        run: bash scripts/checkout-p2pd.sh
      - name: Build Linux daemon locally in the runner (no registry push)
        run: docker build --platform linux/amd64 -t p2pd:beta-verify -f .p2pd-src/deploy/Dockerfile .p2pd-src
      - name: Test the desktop Docker launch contract on signet
        run: python3 scripts/test-p2p-docker.py --image p2pd:beta-verify --report docker-smoke.json
      - name: Show non-secret smoke result
        if: always()
        run: test ! -f docker-smoke.json || cat docker-smoke.json

  verify-draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [desktop, docker-linux-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify complete installer set and attach checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,body |
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .isPrerelease and (.body | contains($sha))'
          mkdir installers
          cd installers
          gh release download "$GITHUB_REF_NAME" -p '*.dmg' -p '*.msi' -p '*.exe' -p '*.deb' -p '*.AppImage'
          shopt -s nullglob
          mac=( *.dmg ); linux=( *.deb *.AppImage ); windows=( *.msi *.exe )
          [[ ${#mac[@]} == 2 && ${#linux[@]} == 2 && ${#windows[@]} == 2 ]]
          sha256sum -- "${mac[@]}" "${linux[@]}" "${windows[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
