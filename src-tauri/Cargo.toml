[package]
name = "kaleidoswap"
version = "0.6.0"
description = "Kaleidoswap App"
authors = ["Kaleidoswap Team"]
license = "MIT"
repository = "https://github.com/kaleidoswap/desktop-app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
dotenvy = "0.15"
rusqlite = { version = "0.37.0", features = ["bundled"] }

tokio = { version = "1.0", features = ["full"] }

tauri-plugin-log = { features = ["colored"], version = "2.7.1" }
log = { version = "0.4.22", features = ["release_max_level_info"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-shell = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-clipboard-manager = "2.3.2"
serde_json = "1.0"
tauri-plugin-opener = "2.5.2"
reqwest = { version = "0.13.2", features = ["blocking", "json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }
# KaleidoMind on-demand runtime download (tarball fetch + verify + extract)
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
libc = "0.2"
dirs = "5"

# Nostr Wallet Connect (NIP-47) service
nostr = { version = "0.44", features = ["nip04", "nip06", "nip44", "nip47"] }
nostr-sdk = "0.44"

# Encryption dependencies
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
hex = "0.4"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Maker signer: the client side of a hosted p2pd maker (kaleidoswap/p2pd, branch feat/maker-engine).
# Pinned to a commit; bump `rev` on both lines together (rgb-lib must match signer-core's).
signer-core = { git = "https://github.com/kaleidoswap/p2pd", rev = "e970971aeaf8fd2d2bae57eb3be99dc586fd2572" }
rgb-lib = { git = "https://github.com/kaleidoswap/rgb-lib", rev = "90668f51da32f72a302deba2c90bdf24ef678af2", features = ["esplora", "camel_case"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Touch ID (or the device-owner prompt) before the maker's signing policy is signed
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
default = []

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.9.0"
