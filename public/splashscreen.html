<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Opening KaleidoSwap</title>
    <style>
      @font-face {
        font-family: Satoshi;
        src: url('/fonts/Satoshi-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Satoshi;
        src: url('/fonts/Satoshi-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family:
          Satoshi,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #f4f5fa;
        background: #11131d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 65% 30%, #6f32ff12, transparent 60%),
          radial-gradient(ellipse at 25% 75%, #15e99a0a, transparent 60%),
          #11131d;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100% - 48px, 340px);
        text-align: center;
        animation: arrive 450ms ease-out both;
      }
      .brand-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 144px;
        height: 144px;
        margin-bottom: 28px;
      }
      .brand-mark::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, #6f32ff1c, transparent 70%);
      }
      .orbit {
        position: absolute;
        inset: 0;
        border: 1px solid #ffffff08;
        border-radius: 50%;
      }
      .orbit::after {
        content: '';
        position: absolute;
        inset: -1px;
        border: 1px solid transparent;
        border-top-color: #15e99a70;
        border-right-color: #6f32ff50;
        border-radius: inherit;
        animation: orbit 4s linear infinite;
      }
      .logo {
        position: relative;
        width: 76px;
        height: 76px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -1px;
      }
      .tagline {
        margin: 12px 0 36px;
        color: #969aaa;
        font-size: 14px;
        line-height: 1.5;
      }
      .loading {
        width: 100%;
        padding: 20px 24px;
        border: 1px solid #ffffff09;
        border-radius: 16px;
        background: #ffffff03;
      }
      .status {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        margin: 0 0 16px;
        font-size: 13px;
        line-height: 20px;
        color: #c9cbd6;
      }
      .status-light {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #15e99a;
        box-shadow: 0 0 10px #15e99a35;
      }
      .activity-track {
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: #ffffff09;
      }
      .activity-fill {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #17b581, #15e99a, #8560ff);
        animation: activity 1.8s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes activity {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(360%);
        }
      }
      @media (max-height: 420px) {
        .brand-mark {
          width: 100px;
          height: 100px;
          margin-bottom: 16px;
        }
        .logo {
          width: 56px;
          height: 56px;
        }
        .tagline {
          margin-bottom: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
        .activity-fill {
          width: 100%;
          opacity: 0.65;
          will-change: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-busy="true">
      <div class="brand-mark" aria-hidden="true">
        <div class="orbit"></div>
        <img src="/kaleidoswap-pictogram.svg" alt="" class="logo" />
      </div>
      <h1>KaleidoSwap</h1>
      <p class="tagline">Trustless trading on Lightning Network</p>
      <div class="loading" role="status" aria-live="polite">
        <p class="status">
          <span class="status-light" aria-hidden="true"></span>
          Opening your workspace
        </p>
        <div class="activity-track" aria-hidden="true">
          <div class="activity-fill"></div>
        </div>
      </div>
    </main>
  </body>
</html>
